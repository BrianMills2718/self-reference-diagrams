<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="780" viewBox="0 0 1020 780" role="img" aria-label="Four investigations with assumptions scoped to branches">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#14283e} .small{font-size:13px} .body{font-size:16px} .title{font-size:23px;font-weight:700} .var{font-size:17px;font-weight:700} .label{font-size:12px;fill:#536477}</style>
<rect width="1020" height="780" fill="#f7f9fc"/>
<text x="30" y="38" class="title" text-anchor="start">04  |  Follow a supposition through the connected constraints</text>
<text x="30" y="70" class="body" text-anchor="start">Each panel starts a separate context (a scope in which the listed hypothesis applies).</text>
<rect x="25" y="95" width="480" height="310" rx="14" fill="white" stroke="#d6dfe8"/>
